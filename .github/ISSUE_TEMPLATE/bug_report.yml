name: 问题报告
description: 报告可复现的缺陷。
title: "[问题] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请删除材料中的 API Key、私人网页、文档内容和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: PickGloss 版本
      placeholder: 例如 0.1.12
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 环境
      placeholder: Windows 版本、位数、单屏或多屏、显示缩放
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构或已脱敏材料描述最短操作路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除 API Key、私人文档、会话截图和其他敏感材料。
          required: true
