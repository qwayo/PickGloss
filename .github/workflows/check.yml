name: 检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 公开内容检查
        run: npm run check:publication
      - name: 自动化测试
        run: npm test
