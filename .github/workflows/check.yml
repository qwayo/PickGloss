name: 检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_package:
        description: '另外执行打包与真实 EXE 本机服务贯通（不发布）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 脚本编码检查
        run: npm run check:script-encoding
      - name: 原生助手编译检查
        # 隐藏桌面专项从默认 build/native 读取助手，编译与运行必须使用同一目录。
        run: npm run build:native
      - name: 安装 Electron 运行时
        run: npx --no-install install-electron
      - name: 公开内容检查
        run: npm run check:publication
      - name: 自动化测试
        run: npm test -- --test-concurrency=1
      - name: 隐藏界面检查（不代表原生实屏验收）
        run: npm run check:ui
      - name: 打包与冻结便携包验证
        if: github.event_name == 'workflow_dispatch' && inputs.verify_package
        run: npm run package
      - name: 保留隔离界面失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 界面失败诊断
          path: |
            output/verification/
            dist/**/便携失败诊断.json
          if-no-files-found: ignore
