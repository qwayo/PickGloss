name: 检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_package:
        description: '另外执行打包与真实 EXE 本机服务贯通（不发布）'
        type: boolean
        default: false
      verify_ocr:
        description: '另外验证 Windows OCR 与中英文语言能力；缺失时专项失败'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 脚本编码检查
        run: npm run check:script-encoding
      - name: 原生助手编译检查
        # 隐藏桌面专项从默认 build/native 读取助手，编译与运行必须使用同一目录。
        run: npm run build:native
      - name: 安装 Electron 运行时
        run: npx --no-install install-electron
      - name: 公开内容检查
        run: npm run check:publication
      - name: 自动化测试
        run: npm test -- --test-concurrency=1
      - name: 根据改动执行专项并记录未覆盖能力
        shell: pwsh
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          CHECK_EVENT: ${{ github.event_name }}
          VERIFY_PACKAGE: ${{ inputs.verify_package }}
          VERIFY_OCR: ${{ inputs.verify_ocr }}
        run: |
          $checkArgs = @('scripts/check-changes.cjs', '--output-dir', 'output/verification/changes-ci')
          if ($env:CHECK_BASE -match '^0+$') {
            $checkArgs += @('--base', 'HEAD', '--all')
          }
          if ($env:CHECK_EVENT -eq 'workflow_dispatch') { $checkArgs += '--ui-all' }
          if ($env:VERIFY_PACKAGE -eq 'true') { $checkArgs += '--package' }
          if ($env:VERIFY_OCR -eq 'true') { $checkArgs += '--ocr' }
          & node @checkArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保留检查选择、能力边界与隔离证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 界面失败诊断
          path: |
            output/verification/
            dist/**/便携失败诊断.json
          if-no-files-found: ignore
